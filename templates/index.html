<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课堂签到系统</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>课堂签到系统</h1>
    <p class="subtitle">软件工程课内实验一 · 签到系统示例</p>
  </header>

  <main class="layout">
    <!-- 左侧：签到表单 -->
    <section class="card">
      <h2>学生签到</h2>
      <form id="checkin-form" autocomplete="off">
        <label for="student_id">学号</label>
        <input id="student_id" name="student_id" type="text"
               placeholder="请输入学号，例如 20230001" required />

        <label for="name">姓名</label>
        <input id="name" name="name" type="text"
               placeholder="请输入姓名" required />

        <button type="submit" id="submit-btn">立即签到</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <!-- 右侧：统计 + 记录 -->
    <section class="card">
      <h2>今日统计 <span id="stats-date" class="muted"></span></h2>
      <div class="stats">
        <div class="stat"><span class="num" id="stat-total">0</span><span class="label">已签到</span></div>
        <div class="stat"><span class="num" id="stat-ontime">0</span><span class="label">正常</span></div>
        <div class="stat"><span class="num" id="stat-late">0</span><span class="label">迟到</span></div>
      </div>

      <h2>签到记录 <button type="button" id="refresh-btn" class="ghost">刷新</button></h2>
      <div class="table-wrap">
        <table id="records-table">
          <thead>
            <tr>
              <th>#</th><th>学号</th><th>姓名</th><th>签到时间</th><th>状态</th>
            </tr>
          </thead>
          <tbody id="records-body">
            <tr><td colspan="5" class="empty">暂无签到记录</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">Python 标准库实现 · 零第三方依赖</footer>
  <script src="/static/app.js"></script>
</body>
</html>
